app-id: info.smplayer.SMPlayer
runtime: org.kde.Platform
runtime-version: 5.15-25.08
sdk: org.kde.Sdk
rename-desktop-file: smplayer.desktop
rename-appdata-file: smplayer.appdata.xml
rename-icon: smplayer
command: smplayer
finish-args:
  - --share=ipc
  - --share=network
  - --socket=x11
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=host
  - --talk-name=org.freedesktop.ScreenSaver
  - --own-name=org.mpris.MediaPlayer2.smplayer
cleanup:
  - /include
  - /lib/pkgconfig
  - /share/doc
  - /share/man
  - '*.la'
  - '*.a'

modules:
  - name: smplayer
    buildsystem: simple
    build-options:
      env:
        QMAKEPATH: /app/lib
      arch:
        x86_64:
          env:
            QDEFOPTS: DEFINES+=NO_MPLAYER
        aarch64:
          env:
            QDEFOPTS: DEFINES+=NO_MPLAYER
    build-commands:
      - make PREFIX=/app QMAKE_OPTS=$QDEFOPTS -j$FLATPAK_BUILDER_N_JOBS install
      - install -Dm644 icons/smplayer.svg /app/share/icons/hicolor/scalable/apps/smplayer.svg
    sources:
      - type: git
        url: https://github.com/smplayer-dev/smplayer.git
        tag: v25.6.0
        commit: b62faa90efb6c6be8e0938a42e70fbfb3916feb6
        disable-shallow-clone: true

    modules:
      - name: mpv
        buildsystem: meson
        config-opts:
          - -Dlibmpv=false
          - -Dlua=enabled
          - -Ddebug=false
          - -Dbuild-date=false
          - -Dalsa=disabled
          - -Dmanpage-build=disabled
        cleanup:
          - /share/applications
          - /share/bash-completion
          - /share/fish
          - /share/icons
          - /share/zsh
        sources:
          - type: archive
            url: https://github.com/mpv-player/mpv/archive/v0.41.0.tar.gz
            sha256: ee21092a5ee427353392360929dc64645c54479aefdb5babc5cfbb5fad626209

        modules:
          - name: libass
            config-opts:
              - --disable-static
            sources:
              - type: archive
                url: https://github.com/libass/libass/releases/download/0.17.4/libass-0.17.4.tar.xz
                sha256: 78f1179b838d025e9c26e8fef33f8092f65611444ffa1bfc0cfac6a33511a05a

          - name: ffmpeg
            disabled: false
            config-opts:
              - --disable-debug
              - --disable-doc
              - --disable-static
              - --enable-encoder=png
              - --enable-gnutls
              - --enable-gpl
              - --enable-shared
              - --enable-version3
              - --enable-libaom
              - --enable-libass
              #- --enable-libbs2b
              - --enable-libdav1d
              - --enable-libfreetype
              - --enable-libmp3lame
              - --enable-libopus
              - --enable-libjxl
              #- --enable-libmysofa
              - --enable-libtheora
              - --enable-libv4l2
              - --enable-libvorbis
              - --enable-libvpx
              #- --enable-libx264
              #- --enable-libx265
              - --enable-libwebp
              #- --enable-libsmbclient
              - --enable-libxml2
              - --enable-vulkan
              - --enable-libdrm
              - --enable-vaapi
            cleanup:
              - /share/ffmpeg/examples
            sources:
              - type: archive
                url: https://ffmpeg.org/releases/ffmpeg-7.1.3.tar.xz
                sha256: f0bf043299db9e3caacb435a712fc541fbb07df613c4b893e8b77e67baf3adbe

          - name: libXpresent
            buildsystem: autotools
            sources:
              - type: archive
                url: https://xorg.freedesktop.org/archive/individual/lib/libXpresent-1.0.2.tar.xz
                sha256: 4e5b21b4812206a4b223013606ae31170502c1043038777a1ef8f70c09d37602

          - name: libplacebo
            buildsystem: meson
            config-opts:
              - -Dd3d11=disabled
              - -Ddemos=False
            sources:
              - type: archive
                url: https://code.videolan.org/videolan/libplacebo/-/archive/v7.360.1/libplacebo-v7.360.1.tar.gz
                sha256: 14c0a99f4b01557ec9826ce6b1d52f6de21be274ba03fd5aab7307f18766dc39
              - type: archive
                url: https://github.com/pallets/markupsafe/archive/refs/tags/3.0.3.tar.gz
                sha256: f1d9d06c34515dd3ad210ec769da613057b536d11d6c039183b87757a883a254
                dest: 3rdparty/markupsafe
              - type: archive
                url: https://github.com/pallets/jinja/archive/refs/tags/3.1.6.tar.gz
                sha256: 2074b22a72caa65474902234b320d73463d6d4c223ee49f4b433495758356337
                dest: 3rdparty/jinja
              - type: archive
                url: https://github.com/Dav1dde/glad/archive/refs/tags/v2.0.8.tar.gz
                sha256: 44f06f9195427c7017f5028d0894f57eb216b0a8f7c4eda7ce883732aeb2d0fc
                dest: 3rdparty/glad

          - shared-modules/luajit/luajit.json

          - name: uchardet
            buildsystem: cmake-ninja
            config-opts:
              - -DCMAKE_BUILD_TYPE=Release
              - -DBUILD_STATIC=0
              - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
            cleanup:
              - /lib/cmake
              - /bin
            sources:
              - type: archive
                url: https://www.freedesktop.org/software/uchardet/releases/uchardet-0.0.8.tar.xz
                sha256: e97a60cfc00a1c147a674b097bb1422abd9fa78a2d9ce3f3fdcc2e78a34ac5f0

          - name: fribidi
            cleanup:
              - /bin
            sources:
              - type: archive
                url: https://github.com/fribidi/fribidi/releases/download/v1.0.5/fribidi-1.0.5.tar.bz2
                sha256: 6a64f2a687f5c4f203a46fa659f43dd43d1f8b845df8d723107e8a7e6158e4ce

      - name: mplayer
        disabled: true
        buildsystem: autotools
        build-options:
          arch:
            x86_64:
              config-opts:
                - --enable-runtime-cpudetection
        config-opts:
          - --disable-gui
          - --disable-mencoder
          - --extra-libs-mplayer=-lrt
          - --disable-libmpeg2-internal
          - --disable-ffmpeg_a
          - --yasm=
        sources:
          - type: git
            url: https://github.com/smplayer-dev/mplayer-mod.git
            tag: v1.5-110
            commit: ea47c72e2b91a0a42fd2723f075bd7adb43ec55a

      - name: smplayer-skins
        buildsystem: simple
        build-commands:
          - make PREFIX=/app
          - make PREFIX=/app install
        sources:
          - type: archive
            url: https://sourceforge.net/projects/smplayer/files/SMPlayer-skins/20.11.0/smplayer-skins-20.11.0.tar.bz2
            sha256: 3bbfe7f31f2ebaa158b9e7c9f7601b0116eb375bb577cf65e313a9a45c622973

      - name: smplayer-themes
        buildsystem: simple
        build-commands:
          - make PREFIX=/app
          - make PREFIX=/app install
        sources:
          - type: archive
            url: https://sourceforge.net/projects/smplayer/files/SMPlayer-themes/20.11.0/smplayer-themes-20.11.0.tar.bz2
            sha256: b99c02a13e5587e0c59d127d2f2536a1bc2740e726fadb47c89d349df5951132
